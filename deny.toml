[graph]
all-features = true

[advisories]
# Same ignore set as the cargo-audit job (belt-and-braces overlap intended).
# Resolve advisories by bumping, not by ignoring them. An entry here says which
# crate pulls the code in, why that path is unreachable, the upstream status
# with the date it was checked, and what retires it.
ignore = [
    # RUSTSEC-2023-0071 — rsa (Marvin Attack: timing side-channel in RSA key
    # operations).
    #
    # Why: rsa enters Cargo.lock through sqlx-macros-core → sqlx-mysql, an
    # optional sqlx dependency. The manifest enables the postgres backend only
    # (no mysql feature), so cargo never resolves sqlx-mysql or rsa into the
    # build graph: `cargo tree -i rsa --target all -e all --workspace
    # --all-features` prints nothing. rsa is not compiled into the binary.
    #
    # Re-checked 2026-11-13: still lockfile-only. rsa 0.10.0 is patched, but
    # sqlx-mysql 0.8.6 (the newest 0.8) requires rsa ^0.9, so no lockfile
    # update reaches it; sqlx-mysql 0.9.0 requires rsa 0.10. Both
    # svc-notifier and br-util-postgres depend on sqlx 0.8. Retire this ignore
    # when every sqlx in Cargo.lock is 0.9 or later, or when sqlx-mysql leaves
    # Cargo.lock.
    #
    # Tools: cargo audit reads Cargo.lock, so it reports the advisory and needs
    # the CI ignore. cargo deny reads the resolved graph, so it does not see
    # rsa and warns `advisory-not-detected` for this entry; that is expected.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0459 — libsqlite3-sys 0.30.1 (bundled C SQLite,
    # CVE-2026-119375; patched in libsqlite3-sys >= 0.39.0).
    #
    # Why: libsqlite3-sys enters Cargo.lock the same way as rsa above, through
    # sqlx and sqlx-macros-core → sqlx-sqlite, an optional sqlx dependency. The
    # manifest enables no sqlite feature, so cargo never resolves sqlx-sqlite or
    # libsqlite3-sys into the build graph: `cargo tree -i libsqlite3-sys
    # --target all -e all --workspace --all-features` prints nothing. No SQLite
    # code is compiled into the binary, and there is no feature to drop.
    #
    # Checked 2026-11-13: no sqlx release accepts a patched libsqlite3-sys.
    # sqlx-sqlite 0.8.6 (the newest 0.8) requires ^0.30.1 and sqlx-sqlite 0.9.0
    # requires >=0.30.1, <0.38.0, so neither a lockfile update nor a move to
    # sqlx 0.9 clears it. Retire this ignore when Cargo.lock can take
    # libsqlite3-sys >= 0.39.0 through a sqlx release, or when sqlx-sqlite
    # leaves Cargo.lock.
    #
    # Tools: same as rsa above. cargo audit needs the CI ignore; cargo deny
    # warns `advisory-not-detected` for this entry; that is expected.
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/BotResources/br-rust-common",
    "https://github.com/BotResources/br-e2e-harness",
]
