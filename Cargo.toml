[workspace]
members = ["crates/br-notifier-contract", "crates/br-notifier-publisher"]
default-members = [".", "crates/br-notifier-contract", "crates/br-notifier-publisher"]

[package]
name = "svc-notifier"
version = "1.0.7"
edition = "2024"
publish = false
rust-version = "1.94"
license = "Apache-2.0"
description = "Standalone notification service — NATS intake, GraphQL API, RLS, real-time subscriptions"
repository = "https://github.com/BotResources/svc-notifier"

[features]
default = ["notifications"]
notifications = []

[dependencies]
br-notifier-contract = { path = "crates/br-notifier-contract" }
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "v1.3.0", version = "1.3.0" }
br-core-integration = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-integration", tag = "v1.3.0", version = "1.3.0" }
service-engine = { git = "https://github.com/BotResources/br-service-engine", package = "service-engine", tag = "v0.4.0", version = "0.4.0" }
async-graphql = { version = "7", features = ["chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "json", "uuid", "chrono", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }

[dev-dependencies]
async-nats = "0.48"
br-notifier-contract = { path = "crates/br-notifier-contract" }
br-notifier-publisher = { path = "crates/br-notifier-publisher" }
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "v1.3.0", version = "1.3.0", features = ["test-support"] }
br-core-integration = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-integration", tag = "v1.3.0", version = "1.3.0" }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-nats-fabric", tag = "v1.3.0", version = "1.3.0" }
br-test-harness = { git = "https://github.com/BotResources/br-e2e-harness", package = "br-test-harness", tag = "v1.2.0", version = "1.2.0", default-features = false, features = ["passport", "graphql", "sse", "ws", "nats-fabric", "spawned-nats"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde_json = "1"
serial_test = "3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "json", "uuid", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
