name: CD

on:
  push:
    branches: [main]
    tags:
      - "svc-notifier/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Service version to (re)publish (defaults to Cargo.toml)"
        required: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  IMAGE_REF: ghcr.io/botresources/br-svc-notifier

jobs:
  detect-bump:
    name: detect-bump
    runs-on: ubuntu-latest
    outputs:
      publish_service: ${{ steps.detect.outputs.publish_service }}
      service_version: ${{ steps.detect.outputs.service_version }}
      tag_contract: ${{ steps.detect.outputs.tag_contract }}
      contract_version: ${{ steps.detect.outputs.contract_version }}
      tag_publisher: ${{ steps.detect.outputs.tag_publisher }}
      publisher_version: ${{ steps.detect.outputs.publisher_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect version bumps
        id: detect
        shell: bash
        run: |
          crate_version() {
            grep -E '^version\s*=' "$1" | head -1 | sed 's/.*"\(.*\)".*/\1/'
          }
          is_release() {
            case "$1" in
              0.0.0|*-dev|*-rc*|*-pre*) return 1 ;;
              *) return 0 ;;
            esac
          }
          tag_exists() {
            git ls-remote --tags origin "refs/tags/$1" | grep -q .
          }

          service_version="$(crate_version Cargo.toml)"
          publish_service=false
          case "${GITHUB_REF}" in
            refs/tags/svc-notifier/v*)
              service_version="${GITHUB_REF#refs/tags/svc-notifier/v}"
              publish_service=true
              echo "Tag trigger — republishing svc-notifier ${service_version}"
              ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                input_version="${{ inputs.version }}"
                [ -n "$input_version" ] && service_version="$input_version"
                publish_service=true
                echo "Manual dispatch — publishing svc-notifier ${service_version}"
              elif is_release "$service_version" \
                && ! tag_exists "svc-notifier/v${service_version}" \
                && ! tag_exists "v${service_version}"; then
                if grep -qE "^## ${service_version}( |$)" CHANGELOG.md; then
                  publish_service=true
                else
                  echo "::warning::svc-notifier ${service_version} has no CHANGELOG heading — not publishing"
                fi
              else
                echo "svc-notifier ${service_version}: already released or not a release version"
              fi
              ;;
          esac

          contract_version="$(crate_version crates/br-notifier-contract/Cargo.toml)"
          tag_contract=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
            && is_release "$contract_version" \
            && ! tag_exists "br-notifier-contract/v${contract_version}"; then
            if grep -qE "^## ${contract_version}( |$)" crates/br-notifier-contract/CHANGELOG.md; then
              tag_contract=true
            else
              echo "::warning::br-notifier-contract ${contract_version} has no CHANGELOG heading — not tagging"
            fi
          else
            echo "br-notifier-contract ${contract_version}: already tagged or not applicable"
          fi

          publisher_version="$(crate_version crates/br-notifier-publisher/Cargo.toml)"
          tag_publisher=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ] \
            && is_release "$publisher_version" \
            && ! tag_exists "br-notifier-publisher/v${publisher_version}"; then
            if grep -qE "^## ${publisher_version}( |$)" crates/br-notifier-publisher/CHANGELOG.md; then
              tag_publisher=true
            else
              echo "::warning::br-notifier-publisher ${publisher_version} has no CHANGELOG heading — not tagging"
            fi
          else
            echo "br-notifier-publisher ${publisher_version}: already tagged or not applicable"
          fi

          {
            echo "publish_service=${publish_service}"
            echo "service_version=${service_version}"
            echo "tag_contract=${tag_contract}"
            echo "contract_version=${contract_version}"
            echo "tag_publisher=${tag_publisher}"
            echo "publisher_version=${publisher_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Registry gate (pre-build)
        if: steps.detect.outputs.publish_service == 'true'
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: scripts/registry-gate.sh svc-notifier "${{ steps.detect.outputs.service_version }}" "${IMAGE_REF}"

  publish:
    name: Publish image + chart
    needs: detect-bump
    if: needs.detect-bump.outputs.publish_service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (Docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Registry gate (pre-publish re-check)
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: scripts/registry-gate.sh svc-notifier "${{ needs.detect-bump.outputs.service_version }}" "${IMAGE_REF}"

      - name: Build amd64 binary (SDL source, reused by publish.sh)
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl

      - name: Install sqlx-cli (pinned — it shapes the posed document)
        run: >
          cargo install sqlx-cli
          --version 0.8.6
          --locked
          --no-default-features
          --features rustls,postgres

      - name: Registry docs (pose SDL + DB schema before the push)
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-docs.sh
          svc-notifier
          "${{ needs.detect-bump.outputs.service_version }}"
          --binary target/x86_64-unknown-linux-musl/release/svc-notifier

      - name: Publish image + chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: ./scripts/publish.sh --skip-checks

  registry-implement:
    name: Registry implement svc-notifier
    needs: [detect-bump, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.detect-bump.outputs.publish_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record image + observe the implemented flip
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: >
          scripts/registry-implement.sh
          svc-notifier
          "${{ needs.detect-bump.outputs.service_version }}"
          "${IMAGE_REF}:${{ needs.detect-bump.outputs.service_version }}"

  tag-service:
    name: Tag + Release svc-notifier
    needs: [detect-bump, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.detect-bump.outputs.publish_service == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag + GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-bump.outputs.service_version }}
        run: |
          tag="svc-notifier/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "$tag" \
            --notes "See the \`## ${VERSION}\` section of CHANGELOG.md."

  tag-contract:
    name: Tag + Release br-notifier-contract
    needs: detect-bump
    if: needs.detect-bump.outputs.tag_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag + GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-bump.outputs.contract_version }}
        run: |
          tag="br-notifier-contract/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "$tag" \
            --notes "See the \`## ${VERSION}\` section of crates/br-notifier-contract/CHANGELOG.md."

  tag-publisher:
    name: Tag + Release br-notifier-publisher
    needs: detect-bump
    if: needs.detect-bump.outputs.tag_publisher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag + GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-bump.outputs.publisher_version }}
        run: |
          tag="br-notifier-publisher/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "$tag" \
            --notes "See the \`## ${VERSION}\` section of crates/br-notifier-publisher/CHANGELOG.md."
